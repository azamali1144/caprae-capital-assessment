[project]
name = "leadlens-backend"
version = "0.1.0"
description = "LeadLens api - ingest, enrich, validate and score leads"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx[http2]>=0.28.1",
    "phonenumbers>=9.0.40",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "selectolax>=0.4.12",
    "sqlalchemy[asyncio]>=2.1.1",
    "tenacity>=9.1.4",
    "tldextract>=5.3.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
