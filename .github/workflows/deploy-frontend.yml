name: deploy frontend

# builds the next.js image and ships it to cloud run, next to the api.
# does nothing until the GCP_* repo variables are set (see docs/deployment.md)
on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.API_URL != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      IMAGE: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/leadlens/web:${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build + push image
        working-directory: frontend
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg NEXT_PUBLIC_API_URL="${{ vars.API_URL }}/api/v1" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy leadlens-web \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --port 3000 \
            --min-instances 0 --max-instances 3 \
            --memory 512Mi
